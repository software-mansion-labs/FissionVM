name: Build & test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: |
            ${{ secrets.ACCESS_TO_ELIXIR_WASM }}
      - name: Set up Elixir
        uses: erlef/setup-beam@61e01a43a562a89bfc54c7f9a378ff67b03e4a21 # v1.16.0
        with:
          elixir-version: "1.17.3"
          otp-version: "26.0.2"
      - name: Install deps
        run: |
          sudo apt install -y gperf libmbedtls-dev zlib1g-dev
      - name: Build
        run: |
          echo "" > libs/CMakeLists.txt # disable stdlibs compilation, which hangs for unknown reasons
          export PATH=$PATH:/home/runner/.mix/elixir/1-17/ # for rebar3
          mkdir build
          cd build
          cmake -DAVM_BUILD_RUNTIME_ONLY=ON -DSANITIZER=OFF -DDEBUG_GC=ON -DDEBUG_ASSERTIONS=ON ..
          make -j $(nproc)
      # - name: Test
      #   run: |
      #     cd build
      #     tests/test-erlang
      #     tests/test-enif
      #     tests/test-mailbox
      #     tests/test-structs
      - name: Build FissionLib
        run: |
          git clone git@github.com:software-mansion-labs/elixir-wasm.git
          cd elixir-wasm/fission_lib
          echo "import Config; config :fission_lib, atomvm_path: \"../../build/src/AtomVM\"" > config/config.secret.exs
          mix deps.get
          MIX_ENV=test mix compile
      - name: Test FissionLib
        run: cd elixir-wasm/fission_lib && mix test
