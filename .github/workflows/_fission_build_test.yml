# separate terms of service, privacy policy, and support
# documentation.

name: Build & test

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: |
            ${{ secrets.ACCESS_TO_ELIXIR_WASM }}
      - name: Set up Elixir
        uses: erlef/setup-beam@61e01a43a562a89bfc54c7f9a378ff67b03e4a21 # v1.16.0
        with:
          elixir-version: "1.17.3"
          otp-version: "26.0.2"
      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
      - name: Install deps
        run: |
          sudo apt install -y gperf libmbedtls-dev zlib1g-dev
      - name: Build Unix
        run: |
          echo "" > libs/CMakeLists.txt # disable stdlibs compilation, which hangs for unknown reasons
          export PATH=$PATH:/home/runner/.mix/elixir/1-17/ # for rebar3
          mkdir build
          cd build
          cmake -DAVM_BUILD_RUNTIME_ONLY=ON -DSANITIZER=OFF -DDEBUG_ASSERTIONS=ON ..
          make -j $(nproc)
      - name: Build Emscripten
        run: |
          echo "" > libs/CMakeLists.txt # disable stdlibs compilation, which hangs for unknown reasons
          export PATH=$PATH:/home/runner/.mix/elixir/1-17/ # for rebar3
          mkdir src/platforms/emscripten/build
          cd src/platforms/emscripten/build
          emcmake cmake .. -DAVM_EMSCRIPTEN_ENV=web -DAVM_BUILD_RUNTIME_ONLY=ON -DSANITIZER=ON -DDEBUG_ASSERTIONS=ON
          emmake make -j $(nproc)
      - name: Build Popcorn
        run: |
          git clone git@github.com:software-mansion/popcorn.git
          cd popcorn/popcorn/elixir
          echo 'import Config; config :popcorn, :runtime, [{:path, "../../../build/src", target: :unix}, {:path, "../../../src/platforms/emscripten/build/src", target: :wasm}]' > config/config.secret.exs
          mix deps.get
          MIX_ENV=test mix compile
          MIX_ENV=test mix playwright.install
      - name: Test Popcorn Unix
        run: cd popcorn/popcorn/elixir && mix test
      - name: Test Popcorn WASM
        run: cd popcorn/popcorn/elixir && TARGET=wasm mix test
